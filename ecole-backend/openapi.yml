openapi: 3.0.3
info:
  title: 'Plateforme scolaire : API'
  version: 0.1.0
  description: API de gestion d'un collège-lycée privé (notes, bulletins, présences,
    scolarité).
paths:
  /api/v1/absences/:
    get:
      operationId: v1_absences_list
      description: 'Absences et retards. Filtres : `student`, `class`, `status` (A/R),
        `justif`, `from`, `to`.'
      parameters:
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAbsenceList'
          description: ''
  /api/v1/absences/{id}/decide/:
    post:
      operationId: v1_absences_decide_create
      description: 'Éducateur ou direction : accepte ou refuse un justificatif en
        attente.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceDecideInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbsenceDecideInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbsenceDecideInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
          description: ''
  /api/v1/absences/{id}/justify/:
    post:
      operationId: v1_absences_justify_create
      description: La famille dépose un justificatif (motif) pour une absence → «
        en attente ».
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustifyInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JustifyInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JustifyInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
          description: ''
  /api/v1/announcements/:
    get:
      operationId: v1_announcements_list
      description: 'GET : annonces destinées à mon rôle (les auteurs voient aussi
        les leurs). POST : publication (direction, secrétariat).'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Announcement'
          description: ''
    post:
      operationId: v1_announcements_create
      description: 'GET : annonces destinées à mon rôle (les auteurs voient aussi
        les leurs). POST : publication (direction, secrétariat).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Announcement'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Announcement'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Announcement'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/appreciations/:
    put:
      operationId: v1_appreciations_update
      description: Appréciation d'un enseignant (sa matière, sa classe) ; texte vide
        = suppression.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppreciationInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppreciationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppreciationInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: ''
  /api/v1/archives/:
    get:
      operationId: v1_archives_retrieve
      description: |-
        Années passées en consultation (`?year=2026-2027`) : une ligne par élève inscrit cette année-là, avec sa classe d'alors,
        sa moyenne annuelle et la décision prise. Direction et secrétariat : toute l'école ; parents et élèves : leurs propres dossiers
        (notes publiées seulement). Les bulletins se téléchargent ensuite avec `?year=` sur les routes de bulletin.
      parameters:
      - in: query
        name: year
        schema:
          type: string
        description: Année passée, par exemple 2026-2027
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archive'
          description: ''
  /api/v1/assignments/:
    get:
      operationId: v1_assignments_list
      description: 'GET : affectations (`?class=`). PUT : affecte un enseignant à
        (classe, matière) ; `teacher: null` retire l''affectation.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
          description: ''
    put:
      operationId: v1_assignments_update
      description: 'GET : affectations (`?class=`). PUT : affecte un enseignant à
        (classe, matière) ; `teacher: null` retire l''affectation.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Assignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Assignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Assignment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/assignments/repartition/:
    get:
      operationId: v1_assignments_repartition_retrieve
      description: |-
        Répartition des enseignants entre les classes.
        GET : charge de chaque enseignant (heures par semaine, classes, maximum) et, par matière, les classes sans enseignant.
        POST `{subjects?: [id], reset?: bool, commit?: bool}` : propose (ou, avec `commit`, enregistre) une répartition équilibrée.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
    post:
      operationId: v1_assignments_repartition_create
      description: |-
        Répartition des enseignants entre les classes.
        GET : charge de chaque enseignant (heures par semaine, classes, maximum) et, par matière, les classes sans enseignant.
        POST `{subjects?: [id], reset?: bool, commit?: bool}` : propose (ou, avec `commit`, enregistre) une répartition équilibrée.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/attendance/appel/:
    get:
      operationId: v1_attendance_appel_retrieve
      description: 'GET `?class=&date=&slot=` : état de l''appel. PUT : enregistre
        l''appel (remplace le précédent du même créneau).'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppelState'
          description: ''
    put:
      operationId: v1_attendance_appel_update
      description: 'GET `?class=&date=&slot=` : état de l''appel. PUT : enregistre
        l''appel (remplace le précédent du même créneau).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppelResult'
          description: ''
  /api/v1/attendance/sessions/:
    get:
      operationId: v1_attendance_sessions_list
      description: 'Appels effectués (classe, date, créneau), selon les classes visibles.
        Sert à calculer l''assiduité : `?from=&to=&class=`.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppelSessionRow'
          description: ''
  /api/v1/auth/2fa/:
    get:
      operationId: v1_auth_2fa_retrieve
      description: 'Double authentification de l''administrateur de la plateforme
        connecté : état, activation, désactivation.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
    post:
      operationId: v1_auth_2fa_create
      description: 'Démarre l''activation : renvoie la clé à saisir dans l''application.
        Rien n''est actif tant que le code n''est pas confirmé.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/2fa/activer/:
    post:
      operationId: v1_auth_2fa_activer_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/2fa/desactiver/:
    post:
      operationId: v1_auth_2fa_desactiver_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                code:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/captcha/:
    get:
      operationId: v1_auth_captcha_retrieve
      description: 'Nouveau défi anti-robot (ou {enabled: false} quand il est désactivé).'
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/forgot-password/:
    post:
      operationId: v1_auth_forgot_password_create
      description: 'Demande de lien de réinitialisation. Réponse toujours identique
        : on ne révèle pas quels comptes existent.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                ecole:
                  type: string
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Connexion par identifiant et mot de passe. Renvoie les jetons et
        le profil (rôle, permissions).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 'Invalide le jeton de rafraîchissement : la session ne peut plus
        être prolongée.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: v1_auth_reset_password_create
      description: Choix d'un nouveau mot de passe avec le lien reçu par e-mail.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ecole:
                  type: string
                uid:
                  type: string
                token:
                  type: string
                new:
                  type: string
                confirm:
                  type: string
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/calendar/:
    get:
      operationId: v1_calendar_retrieve
      description: Année en cours et trimestres.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Calendar'
          description: ''
  /api/v1/calendar/periodes/:
    put:
      operationId: v1_calendar_periodes_update
      description: |-
        PUT `{periodes: [{label, start, end}]}` : périodes d'évaluation de l'année en cours (trimestres, semestres ou autre), propres à l'école.

        Les périodes existantes sont conservées dans l'ordre (leurs notes aussi) ; on peut en ajouter ou en retirer à la fin.
        Retirer une période qui a déjà des évaluations, des appréciations ou des avis du conseil est refusé.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodesIn'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PeriodesIn'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PeriodesIn'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
          description: ''
  /api/v1/classes/:
    get:
      operationId: v1_classes_list
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
          description: ''
    post:
      operationId: v1_classes_create
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Class'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Class'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Class'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
          description: ''
  /api/v1/classes/{id}/:
    get:
      operationId: v1_classes_retrieve
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
          description: ''
    put:
      operationId: v1_classes_update
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Class'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Class'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Class'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
          description: ''
    patch:
      operationId: v1_classes_partial_update
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClass'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClass'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClass'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Class'
          description: ''
    delete:
      operationId: v1_classes_destroy
      description: Lecture pour tout compte connecté ; écriture réservée aux permissions
        données.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/classes/{id}/bulletins.pdf:
    get:
      operationId: v1_classes_bulletins.pdf_retrieve
      description: Tous les bulletins d'une classe dans un seul PDF (direction et
        secrétariat).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: template
        schema:
          type: string
        description: 'classique, moderne ou compact (défaut : modèle de l''école ;
          ignoré pour parents et élèves, le modèle de l''école s''impose)'
      - in: query
        name: term
        schema:
          type: string
        description: Code du trimestre (T1, T2, T3)
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/classes/import/:
    post:
      operationId: v1_classes_import_create
      description: 'Import de classes (Excel ou CSV). Sans `?commit=1` : simple vérification.'
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportClassesFile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/classes/import/modele/:
    get:
      operationId: v1_classes_import_modele_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/coefficients/:
    get:
      operationId: v1_coefficients_list
      description: 'GET : tous les coefficients. PUT : fixe un coefficient (0 = la
        matière n''est plus enseignée à ce groupe).'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coefficient'
          description: ''
    put:
      operationId: v1_coefficients_update
      description: 'GET : tous les coefficients. PUT : fixe un coefficient (0 = la
        matière n''est plus enseignée à ce groupe).'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoefficientSet'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoefficientSet'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoefficientSet'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coefficient'
          description: ''
  /api/v1/conduct/:
    get:
      operationId: v1_conduct_retrieve
      description: 'GET `?class=&term=` : note de conduite de chaque élève, retraits,
        absences non justifiées et retrait dû selon la règle de l''école.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductClass'
          description: ''
  /api/v1/conduct/absences/apply/:
    post:
      operationId: v1_conduct_absences_apply_create
      description: |-
        Applique à la classe le retrait dû aux absences non justifiées (règle de l'école). Relançable : le retrait « absences »
        de chaque élève est recalculé, jamais ajouté deux fois ; un justificatif accepté entre-temps le diminue.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyInput'
        required: true
      security:
      - jwtAuth: []
      responses:
