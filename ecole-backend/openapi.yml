components:
  schemas:
    Absence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_name:
          type: string
          readOnly: true
        school_class:
          type: integer
        class_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/SlotEnum'
        status:
          $ref: '#/components/schemas/AbsenceStatusEnum'
        justif:
          $ref: '#/components/schemas/JustifEnum'
        motif:
          type: string
          maxLength: 300
      required:
      - class_name
      - date
      - id
      - school_class
      - slot
      - status
      - student
      - student_name
    AbsenceDecideInput:
      type: object
      properties:
        accept:
          type: boolean
      required:
      - accept
    AbsenceStatusEnum:
      enum:
      - A
      - R
      type: string
      description: |-
        * `A` - Absent
        * `R` - Retard
    Account:
      type: object
      properties:
        total:
          type: integer
        paid:
          type: integer
        balance:
          type: integer
        lines:
          type: array
          items: {}
      required:
      - balance
      - lines
      - paid
      - total
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ts:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 80
        detail:
          type: string
          maxLength: 300
      required:
      - action
      - id
      - ts
      - user_name
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 120
        body:
          type: string
          maxLength: 3000
        audience:
          type: array
          items:
            $ref: '#/components/schemas/AudienceEnum'
          minItems: 1
        author:
          type: integer
          readOnly: true
          nullable: true
        author_name:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - audience
      - author
      - author_name
      - body
      - created
      - id
      - title
    AnswersIn:
      type: object
      properties:
        answers:
          type: object
          additionalProperties: {}
      required:
      - answers
    Appel:
      type: object
      properties:
        school_class:
          type: integer
        date:
          type: string
          format: date
        slot:
          type: string
          maxLength: 10
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AppelEntry'
      required:
      - date
      - entries
      - school_class
      - slot
    AppelEntry:
      type: object
      properties:
        student:
          type: integer
        status:
          $ref: '#/components/schemas/AppelEntryStatusEnum'
      required:
      - status
      - student
    AppelEntryStatusEnum:
      enum:
      - P
      - A
      - R
      type: string
      description: |-
        * `P` - P
        * `A` - A
        * `R` - R
    AppelResult:
      type: object
      properties:
        absents:
          type: integer
        notified:
          type: integer
      required:
      - absents
      - notified
    AppelSessionRow:
      type: object
      properties:
        school_class:
          type: integer
        date:
          type: string
          format: date
        slot:
          type: string
      required:
      - date
      - school_class
      - slot
    AppelState:
      type: object
      properties:
        done:
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AppelEntry'
      required:
      - done
      - entries
    ApplyInput:
      type: object
      properties:
        school_class:
          type: integer
        term:
          type: string
          maxLength: 3
      required:
      - school_class
      - term
    ApplyOut:
      type: object
      properties:
        updated:
          type: integer
      required:
      - updated
    AppreciationInput:
      type: object
      properties:
        student:
          type: integer
        term:
          type: string
        subject:
          type: integer
        text:
          type: string
          maxLength: 300
      required:
      - student
      - subject
      - term
      - text
    Archive:
      type: object
      properties:
        years:
          type: array
          items: {}
        rows:
          type: array
          items: {}
      required:
      - rows
      - years
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          type: integer
          nullable: true
        subject:
          type: integer
        school_class:
          type: integer
      required:
      - id
      - school_class
      - subject
      - teacher
    AssignmentInput:
      type: object
      properties:
        school_class:
          type: integer
        subject:
          type: integer
        kind:
          $ref: '#/components/schemas/AssignmentInputKindEnum'
        title:
          type: string
          maxLength: 120
          minLength: 3
        instructions:
          type: string
          maxLength: 3000
        opens_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        allow_late:
          type: boolean
          title: Remise en retard acceptée
        max_points:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          title: Barème (devoir en fichier)
        duration_min:
          type: integer
          maximum: 480
          minimum: 1
          nullable: true
          title: Durée de l'épreuve en minutes
        shuffle:
          type: boolean
          title: Ordre des questions et des réponses mélangé
        correction:
          $ref: '#/components/schemas/CorrectionEnum'
        max_leaves:
          type: integer
          maximum: 20
          minimum: 0
          title: 'Sorties de la page tolérées pendant l''épreuve (0 : pas de limite)'
      required:
      - due_at
      - kind
      - school_class
      - subject
      - title
    AssignmentInputKindEnum:
      enum:
      - fichier
      - epreuve
      type: string
      description: |-
        * `fichier` - Devoir à rendre en fichier
        * `epreuve` - Épreuve en ligne (QCM, vrai/faux)
    AttachIn:
      type: object
      properties:
        file:
          type: string
